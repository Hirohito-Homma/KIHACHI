[project]
name = "kihachi-music-ai"
version = "0.1.0"
description = "A deterministic Music Brain, SongSpec, MIDI composer, ACE-Step adapter, and WAV analyzer prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kihachi = "kihachi_music_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kihachi_music_ai = ["schema/*.json", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
