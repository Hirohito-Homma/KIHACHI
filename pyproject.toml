[project]
name = "kihachi-music-ai"
version = "0.1.0"
description = "A deterministic Music Brain, SongSpec, MIDI composer, ACE-Step adapter, and WAV analyzer prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]
# The core stays standard-library only (ADR-0001). The intent reader is the one
# place that talks to a model, it lives in adapters/, and it imports this inside
# the call -- so `pip install kihachi-music-ai` still pulls nothing.
llm = ["anthropic>=0.69"]
# The note publisher is the other place that talks to a model. Like intent_llm it
# lives in adapters/ and imports its HTTP/UI stack only when invoked.
publisher = ["httpx>=0.27", "nicegui>=2.0"]

[project.scripts]
kihachi = "kihachi_music_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kihachi_music_ai = ["schema/*.json", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
