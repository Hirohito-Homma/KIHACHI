name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Run test suite
        run: python -m pytest -q

      - name: Build source and wheel distributions
        if: matrix.python-version == '3.11'
        run: python -m build

      - name: Smoke-test the built wheel outside the checkout
        if: matrix.python-version == '3.11'
        run: |
          python -m venv /tmp/kihachi-wheel-smoke
          cd /tmp
          /tmp/kihachi-wheel-smoke/bin/python -m pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/kihachi-wheel-smoke/bin/kihachi compose \
            "Mutation Funk、DUB、Tech House。110 BPM、D#m。" \
            --output /tmp/kihachi-compose-smoke
          test -s /tmp/kihachi-compose-smoke/song_spec.json
          test -s /tmp/kihachi-compose-smoke/bass.mid
          test -s /tmp/kihachi-compose-smoke/drums.mid
          test -s /tmp/kihachi-compose-smoke/chords.mid
          test -s /tmp/kihachi-compose-smoke/prompt.txt
